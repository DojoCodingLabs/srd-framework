# SRD Concept Schema
# A "concept" is the INPUT to a Synthetic Demand Validation run — the thing being
# tested against the synthetic panel. Every file written to
# srd/forecasts/<concept-id>.concept.yml MUST conform to this structure.
# All fields are required unless marked (optional).
#
# A concept holds one or more VARIANTS. One variant = "single" mode (absolute read).
# Two or more variants = "duel" mode (comparative-first ranking — the primary signal).

concept:
  id: string                    # Format: "C01", "C02", etc. Sequential, stable across reruns.
  name: string                  # Human label, e.g. "Dojo $500 7-day diagnostic offer"
  surface_type: string          # "offer" | "creative" | "copy" | "feature"
                                #   offer   — a priced product/service offer (enables price_test)
                                #   creative— an ad creative (usually image/asset_ref, multimodal)
                                #   copy    — landing-page / headline / section copy
                                #   feature — a product feature or capability concept
  description: string           # 1-3 sentences: what is being validated and why
  created_date: string          # ISO date: "2026-06-13"

  target_segments: string[]     # Persona IDs from srd/personas.yml (["P01","P03"]) OR
                                # free-form segment descriptors if no SRD exists yet.
                                # Empty/"all" = poll the whole panel.

  comparison_mode: string       # "single" | "duel"
                                # "duel" REQUIRES >=2 variants and drives best-worst/pairwise.

  constructs_to_measure: string[] # Subset of the battery (see construct-battery.md):
                                #   ["purchase_intent","appeal","comprehension","differentiation",
                                #    "believability","price_fairness","willingness_to_pay","share_intent"]
                                # Default if omitted: surface-appropriate set (offer = full battery).

  price_test:                   # (optional) Only meaningful for surface_type: offer
    method: string              # "van_westendorp" | "gabor_granger" | "none"
    currency: string            # ISO 4217: "USD"
    anchor_price: number        # The price shown by default (e.g., 500)
    price_points: number[]      # Gabor-Granger sweep points, e.g. [199, 299, 499, 699, 999]

  variants:                     # 1 variant = single mode; >=2 = duel mode
    - id: string                # "V1", "V2", ... unique within the concept
      label: string             # Short human label, e.g. "Outcome-led headline"
      content: string           # (optional) The text stimulus (copy, offer wording, feature pitch)
      asset_ref: string         # (optional) Path to an image/screenshot for multimodal stimulus
                                #   At least ONE of content / asset_ref must be present per variant.
      price: number             # (optional) Variant-specific price; defaults to price_test.anchor_price
      notes: string             # (optional) What this variant changes vs. the others

# Consistency rules:
# - comparison_mode "duel" => variants has length >= 2.
# - comparison_mode "single" => variants has length == 1.
# - Every variant has at least one of: content, asset_ref.
# - surface_type "creative" SHOULD use asset_ref (the image is the product).
# - price_test present => surface_type == "offer".
# - Every id in target_segments that looks like a persona ID (P\d\d) SHOULD exist in
#   srd/personas.yml; if it doesn't, the run falls back to a generated panel and flags it.
# - willingness_to_pay in constructs_to_measure => price_test.method != "none".
